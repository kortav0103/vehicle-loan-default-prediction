benchmark:
  random_seed: 42
  n_threads: 8
  primary_metric: "roc_auc"
  cv_folds: 5
  default_feature_tier: "F2_safe"

baselines:
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: "lbfgs"
  decision_tree:
    max_depth: 8
    min_samples_leaf: 50
  random_forest:
    n_estimators: 150
    max_depth: 14
    min_samples_leaf: 25
    max_features: "sqrt"
  xgboost:
    n_estimators: 400
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: "hist"
    eval_metric: "logloss"
  lightgbm:
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    verbose: -1
  mlp:
    hidden_layer_sizes: [128, 64]
    activation: "relu"
    alpha: 0.001
    batch_size: 512
    learning_rate_init: 0.001
    max_iter: 35
    early_stopping: true
    validation_fraction: 0.1
    n_iter_no_change: 6

tuning:
  logistic_regression:
    strategy: "grid_search"
    C_grid: [0.01, 0.05, 0.1, 0.5, 1.0, 5.0]
  random_forest:
    strategy: "optuna_tpe"
    n_trials: 10
    cv_folds_tuning: 3
    search_space:
      n_estimators: [120, 200]
      max_depth: [8, 18]
      min_samples_leaf: [10, 80]
      max_features: ["sqrt", "log2", 0.3, 0.5]
  lightgbm:
    strategy: "optuna_tpe"
    n_trials: 20
    cv_folds_tuning: 5
    early_stopping_rounds: 40
    max_estimators: 1200
    search_space:
      num_leaves: [15, 95]
      max_depth: [4, 10]
      min_child_samples: [20, 150]
      learning_rate: [0.015, 0.10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.5, 1.0]
      reg_alpha: [0.001, 10.0]
      reg_lambda: [0.001, 10.0]
  xgboost:
    strategy: "optuna_tpe"
    n_trials: 15
    cv_folds_tuning: 5
    early_stopping_rounds: 40
    max_estimators: 1200
    search_space:
      max_depth: [3, 8]
      min_child_weight: [5, 80]
      learning_rate: [0.015, 0.10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.5, 1.0]
      reg_alpha: [0.001, 10.0]
      reg_lambda: [0.001, 10.0]
      gamma: [0.0, 2.0]

optimization_stage2:
  selected_models:
    - lightgbm
    - xgboost
  lightgbm:
    strategy: "optuna_tpe_warm_start"
    n_trials: 25
    cv_folds_tuning: 5
    early_stopping_rounds: 50
    max_estimators: 2000
    search_space:
      num_leaves: [15, 63]
      max_depth: [4, 9]
      min_child_samples: [30, 200]
      min_split_gain: [0.0, 0.5]
      learning_rate: [0.008, 0.04]
      subsample: [0.55, 0.90]
      colsample_bytree: [0.40, 0.85]
      reg_alpha: [0.05, 25.0]
      reg_lambda: [0.05, 25.0]
  xgboost:
    strategy: "optuna_tpe_warm_start"
    n_trials: 15
    cv_folds_tuning: 5
    early_stopping_rounds: 50
    max_estimators: 2000
    search_space:
      max_depth: [3, 6]
      min_child_weight: [20.0, 150.0]
      learning_rate: [0.008, 0.04]
      subsample: [0.55, 0.90]
      colsample_bytree: [0.40, 0.85]
      gamma: [0.0, 3.0]
      reg_alpha: [0.001, 20.0]
      reg_lambda: [0.05, 25.0]

imbalance_and_cost:
  smote_k_neighbors: 5
  cost_ratios_fn_fp: [3.0, 5.0, 10.0]
  amount_weighted_lgd: 0.50
  amount_weighted_margin: 0.10
